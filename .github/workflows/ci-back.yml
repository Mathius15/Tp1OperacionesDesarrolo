name: CI Back

# Correr solo cuando cambian archivos de la carpeta back/.
# Si no hay cambios en back/, este workflow ni se dispara.
on:
  push:
    branches: ['**']
    paths:
      - 'back/**'
  pull_request:
    branches: ['**']
    paths:
      - 'back/**'

jobs:
  test-back:
    name: Tests del backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: back/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Correr los tests
        run: npm test
