server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Si piden una ruta que no existe como archivo, devolvé index.html.
    # Angular se hace cargo de la ruta. Sin esto, recargar la página en
    # cualquier ruta da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los .js y .css llevan nombre con hash (main-4XWCHE7L.js).
    # Si cambian de nombre, el navegador baja el nuevo solo.
    location ~* \.(js|css|woff2|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index.html NO se cachea: si no, el navegador seguiría pidiendo
    # los .js viejos para siempre.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}